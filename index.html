<!DOCTYPE html>
<html>
<head>
    <title>ScamShield</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>🛡️ ScamShield</h1>
    <p>Detect fake offers instantly</p>

    <form method="POST">
        <textarea name="text" placeholder="Paste message or link here..." required></textarea>
        <button type="submit">Check</button>
    </form>

    {% if result %}
        <div class="result">
            <h2>{{ result }}</h2>
            <ul>
                {% for reason in reasons %}
                    <li>{{ reason }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
</div>

</body>
</html>
